name: Build DebugUnlocker.dylib

on:
  workflow_dispatch:   # 手动触发
  push:
    paths: [Tweak.xm, Makefile, control]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tweak
        working-directory: ${{ github.workspace }}
        run: |
          make clean
          make package   # 生成 .deb
          # 同时把 .dylib 单独拷出来
          mkdir -p artifacts
          cp -f .theos/obj/debug/*.dylib artifacts/DebugUnlocker.dylib 2>/dev/null || true
          cp -f .theos/obj/arm64/*.dylib artifacts/DebugUnlocker.dylib 2>/dev/null || true
          find .theos/obj -name "*.dylib" -exec cp -f {} artifacts/DebugUnlocker.dylib \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugUnlocker-dylib
          path: artifacts/DebugUnlocker.dylib
          retention-days: 30