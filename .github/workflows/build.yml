name: Build DebugUnlocker.dylib

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - Tweak.xm
      - Makefile
      - control
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # Apple Silicon runner 上 /opt 没有写权限，装到 $HOME
          export THEOS=$HOME/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          # Theos 不自带 iOS SDK，补上避免 TARGET=16.0 找不到精确版本
          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xf /tmp/sdks.tar.gz -C $THEOS/sdks --strip-components=1
          ls $THEOS/sdks

      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tweak
        working-directory: ${{ github.workspace }}
        run: |
          make clean
          make package   # 生成 .deb
          # 同时把 .dylib 单独拷出来
          mkdir -p artifacts
          cp -f .theos/obj/debug/*.dylib artifacts/DebugUnlocker.dylib 2>/dev/null || true
          cp -f .theos/obj/arm64/*.dylib artifacts/DebugUnlocker.dylib 2>/dev/null || true
          find .theos/obj -name "*.dylib" -exec cp -f {} artifacts/DebugUnlocker.dylib \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugUnlocker-dylib
          path: artifacts/DebugUnlocker.dylib
          retention-days: 30