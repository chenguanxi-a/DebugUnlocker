name: Build DebugUnlocker.dylib

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - Tweak.xm
      - Makefile
      - control
      - .github/workflows/build.yml

jobs:
  # Linux + Theos：ubuntu runner 通常秒级分配，作为主力构建通道
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl libssl-dev libxml2-dev libplist-utils \
            pkg-config libcurl4-openssl-dev zlib1g-dev clang lld

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          ls $HOME/theos/bin || true

      - name: Install iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xf /tmp/sdks.tar.gz -C $THEOS/sdks --strip-components=1
          ls $THEOS/sdks

      - name: Build Tweak
        run: |
          make clean
          make          # 只编译 dylib（不打包 .deb）
          mkdir -p artifacts
          find .theos/obj -name "*.dylib" -exec cp -f {} artifacts/DebugUnlocker.dylib \;
          ls -la artifacts/
          test -s artifacts/DebugUnlocker.dylib
          file artifacts/DebugUnlocker.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugUnlocker-dylib-linux
          path: artifacts/DebugUnlocker.dylib
          retention-days: 30

  # macOS 原生 Xcode 环境（runner 排队时可能很慢，保留作备用通道）
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # Apple Silicon runner 上 /opt 没有写权限，装到 $HOME
          export THEOS=$HOME/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          # Theos 不自带 iOS SDK，补上避免 TARGET 找不到精确版本
          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xf /tmp/sdks.tar.gz -C $THEOS/sdks --strip-components=1
          ls $THEOS/sdks
          # Theos 签名的 dylib 需要 ldid，仓库里不带，单独下载
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64 -o $THEOS/bin/ldid
          chmod +x $THEOS/bin/ldid
          $THEOS/bin/ldid -h > /dev/null 2>&1 || echo "ldid 可能不可用"

      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tweak
        working-directory: ${{ github.workspace }}
        run: |
          make clean
          make
          mkdir -p artifacts
          find .theos/obj -name "*.dylib" -exec cp -f {} artifacts/DebugUnlocker.dylib \;
          ls -la artifacts/
          test -s artifacts/DebugUnlocker.dylib
          file artifacts/DebugUnlocker.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugUnlocker-dylib-macos
          path: artifacts/DebugUnlocker.dylib
          retention-days: 30
